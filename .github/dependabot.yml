version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Colombo"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Major TypeScript bumps can break Next.js, so I upgrade those by hand.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Tailwind 4 is a migration (CSS-first config, new PostCSS plugin),
      # so I plan it as its own PR instead of taking it from a bot.
      - dependency-name: "tailwindcss"
        # # update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
